<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoneNet — Connexion WiFi</title>

  <!-- Police Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>

    /* ===== FOND DE PAGE ===== */
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #0a0f1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: #e8f0fe;
      padding: 20px;
    }

    /* ===== LOGO ===== */
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-icone {
      font-size: 40px;
      background: linear-gradient(135deg, #00e5ff, #0099cc);
      border-radius: 16px;
      width: 64px;
      height: 64px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .logo h1 {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      margin: 0;
    }

    .logo h1 span {
      color: #00e5ff;
    }

    .logo p {
      color: #6b7a99;
      font-size: 13px;
      margin-top: 4px;
    }

    /* ===== CARTE (formulaire) ===== */
    .carte {
      background: #1a2235;
      border: 1px solid #1e2d45;
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    .carte h2 {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      margin-bottom: 6px;
    }

    .carte p {
      color: #6b7a99;
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    /* ===== CHAMP DE SAISIE ===== */
    .champ {
      margin-bottom: 16px;
    }

    .champ label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #6b7a99;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .champ input {
      width: 100%;
      background: #111827;
      border: 1px solid #1e2d45;
      border-radius: 10px;
      padding: 13px 16px;
      color: #e8f0fe;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .champ input:focus {
      border-color: #00e5ff;
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.1);
    }

    .champ input::placeholder {
      color: #3a4a65;
    }

    /* ===== BOUTON ===== */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
    }

    .btn-connexion {
      background: linear-gradient(135deg, #00e5ff, #0099bb);
      color: #000;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.25);
    }

    .btn-connexion:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(0, 229, 255, 0.4);
    }

    /* ===== MESSAGE D'ERREUR ===== */
    .erreur {
      background: rgba(255, 71, 87, 0.12);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff4757;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none; /* caché par défaut */
    }

    /* ===== LIEN VERS ACHAT ===== */
    .lien-bas {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #6b7a99;
    }

    .lien-bas a {
      color: #00e5ff;
      text-decoration: none;
      font-weight: 500;
    }

    .lien-bas a:hover {
      text-decoration: underline;
    }

  </style>
</head>

<body>

  <!-- LOGO -->
  <div class="logo">
    <div class="logo-icone">📶</div>
    <h1>Zone<span>Net</span></h1>
    <p>Connexion WiFi sécurisée</p>
  </div>

  <!-- FORMULAIRE DE CONNEXION -->
  <div class="carte">
    <h2>Entrez votre code</h2>
    <p>Saisissez le code d'accès que vous avez reçu après votre paiement.</p>

    <!-- Message d'erreur (caché au départ) -->
    <div class="erreur" id="messageErreur">
      ❌ Code incorrect ou expiré. Veuillez réessayer.
    </div>

    <!-- Champ code d'accès -->
    <div class="champ">
      <label for="codeAcces">Code d'accès</label>
      <input
        type="text"
        id="codeAcces"
        placeholder="Ex: ABC-1234"
        maxlength="10"
      />
    </div>

    <!-- Bouton connexion -->
    <button class="btn btn-connexion" onclick="seConnecter()">
      Se connecter →
    </button>
  </div>

  <!-- Lien vers la page d'achat -->
  <div class="lien-bas">
    Pas encore de code ?
    <a href="achat.html">Acheter un accès</a>
  </div>


  <!-- ===== JAVASCRIPT ===== -->
  <script>

    function seConnecter() {

      // 1. Récupérer ce que l'utilisateur a tapé
      const codeEntré = document.getElementById("codeAcces").value.trim().toUpperCase();

      // 2. Charger la liste des codes depuis localStorage (créés via achat.html ou admin.html)
      const adminCodes = JSON.parse(localStorage.getItem("adminCodes") || "[]");

      // 3. Chercher le code dans la liste
      const codeData = adminCodes.find(c => c.code === codeEntré);

      if (codeData && !codeData.bloque) {

        // Vérifier que le code n'est pas expiré
        const tempsRestant = parseInt(localStorage.getItem("tempsRestant_" + codeEntré) || codeData.duree);

        if (tempsRestant <= 0) {
          // Code expiré
          const el = document.getElementById("messageErreur");
          el.textContent = "⏰ Ce code a expiré. Achetez un nouveau forfait.";
          el.style.display = "block";
          return;
        }

        // ✅ Code valide → on sauvegarde et on redirige
        localStorage.setItem("codeActif", codeEntré);
        window.location.href = "session.html";

      } else if (codeData && codeData.bloque) {

        // Code bloqué par l'admin
        const el = document.getElementById("messageErreur");
        el.textContent = "🔒 Ce code a été bloqué. Contactez l'administrateur.";
        el.style.display = "block";

      } else {

        // ❌ Code introuvable
        document.getElementById("messageErreur").style.display = "block";

      }
    }

    // Permettre de valider avec la touche Entrée
    document.getElementById("codeAcces").addEventListener("keypress", function(e) {
      if (e.key === "Enter") seConnecter();
    });

  </script>

</body>
</html>
