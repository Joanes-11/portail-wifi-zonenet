<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoneNet — Ma Session</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #0a0f1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: #e8f0fe;
      padding: 20px;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icone {
      font-size: 40px;
      background: linear-gradient(135deg, #00e5ff, #0099cc);
      border-radius: 16px;
      width: 64px; height: 64px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .logo h1 { font-family: 'Syne', sans-serif; font-size: 26px; margin: 0; }
    .logo h1 span { color: #00e5ff; }
    .logo p { color: #6b7a99; font-size: 13px; margin-top: 4px; }

    .carte {
      background: #1a2235;
      border: 1px solid #1e2d45;
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    /* Badge statut connecté */
    .statut {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,255,157,0.1);
      border: 1px solid rgba(0,255,157,0.3);
      color: #00ff9d;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .point-vert {
      width: 8px; height: 8px;
      background: #00ff9d;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Grand timer */
    .timer-cercle {
      width: 160px; height: 160px;
      border-radius: 50%;
      border: 4px solid #1e2d45;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      background: #111827;
      box-shadow: 0 0 40px rgba(0,229,255,0.1);
      position: relative;
    }
    .timer-cercle::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: #00e5ff;
      animation: tourner 2s linear infinite;
    }
    @keyframes tourner {
      to { transform: rotate(360deg); }
    }
    .timer-chiffres {
      font-family: 'Syne', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: #00e5ff;
      line-height: 1;
    }
    .timer-label {
      font-size: 11px;
      color: #6b7a99;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* Infos session */
    .info-session {
      background: #111827;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 20px;
      text-align: left;
    }
    .info-ligne {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
    }
    .info-ligne span:first-child { color: #6b7a99; }
    .info-ligne span:last-child { font-weight: 500; }

    /* Boutons */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-pause {
      background: linear-gradient(135deg, #ff6b35, #cc4400);
      color: #fff;
      box-shadow: 0 4px 20px rgba(255,107,53,0.25);
    }
    .btn-pause:hover { transform: translateY(-2px); }

    /* Page temps écoulé */
    .expire {
      display: none;
      text-align: center;
    }
    .expire .icone-expire {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .expire h2 {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      color: #ff4757;
      margin-bottom: 8px;
    }
    .expire p {
      color: #6b7a99;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .btn-racheter {
      background: linear-gradient(135deg, #00e5ff, #0099bb);
      color: #000;
      box-shadow: 0 4px 20px rgba(0,229,255,0.25);
    }
  </style>
</head>

<body>

  <div class="logo">
    <div class="logo-icone">📶</div>
    <h1>Zone<span>Net</span></h1>
    <p>Connexion WiFi sécurisée</p>
  </div>

  <div class="carte">

    <!-- VUE NORMALE (timer actif) -->
    <div id="vueSession">

      <div class="statut">
        <div class="point-vert"></div>
        Connecté
      </div>

      <!-- Grand timer -->
      <div class="timer-cercle">
        <div class="timer-chiffres" id="affichageTimer">--:--</div>
        <div class="timer-label">restant</div>
      </div>

      <!-- Infos -->
      <div class="info-session">
        <div class="info-ligne">
          <span>Code actif</span>
          <span id="affichageCode">---</span>
        </div>
        <div class="info-ligne">
          <span>Forfait</span>
          <span>60 minutes</span>
        </div>
        <div class="info-ligne">
          <span>Statut</span>
          <span style="color: #00ff9d;">✓ Actif</span>
        </div>
      </div>

      <!-- Bouton pause/déconnexion -->
      <button class="btn btn-pause" onclick="seDeconnecter()">
        ⏸ Mettre en pause et partir
      </button>
      <p style="color:#6b7a99; font-size:12px; margin-top:10px;">
        Ton temps restant sera sauvegardé. Tu pourras reprendre plus tard avec le même code.
      </p>

    </div>

    <!-- VUE TEMPS ÉCOULÉ -->
    <div class="expire" id="vueExpire">
      <div class="icone-expire">⏰</div>
      <h2>Temps écoulé !</h2>
      <p>Votre session a expiré. Achetez un nouveau forfait pour vous reconnecter.</p>
      <button class="btn btn-racheter" onclick="window.location.href='achat.html'">
        Acheter un nouveau forfait
      </button>
    </div>

  </div>


  <script>

    // ==========================================
    // CONFIGURATION
    // ==========================================

    const DUREE_TOTALE = 60 * 60; // 60 minutes en secondes (modifiable)

    // ==========================================
    // AU CHARGEMENT DE LA PAGE
    // ==========================================

    // Récupérer le code depuis la page de connexion
    const code = localStorage.getItem("codeActif");

    // Si pas de code → retour à l'accueil
    if (!code) {
      window.location.href = "index.html";
    }

    // Afficher le code
    document.getElementById("affichageCode").textContent = code;

    // Récupérer le temps restant sauvegardé (ou utiliser la durée totale)
    let tempsRestant = parseInt(localStorage.getItem("tempsRestant_" + code)) || DUREE_TOTALE;

    // ==========================================
    // TIMER
    // ==========================================

    function afficherTemps(secondes) {
      const minutes = Math.floor(secondes / 60);
      const secs = secondes % 60;
      // Ajouter un zéro si < 10 (ex: 09, 05...)
      const m = String(minutes).padStart(2, '0');
      const s = String(secs).padStart(2, '0');
      document.getElementById("affichageTimer").textContent = m + ":" + s;
    }

    // Démarrer le décompte
    const intervalle = setInterval(function() {

      tempsRestant--;

      // Sauvegarder le temps restant à chaque seconde
      localStorage.setItem("tempsRestant_" + code, tempsRestant);

      // Afficher
      afficherTemps(tempsRestant);

      // Si le temps est écoulé
      if (tempsRestant <= 0) {
        clearInterval(intervalle);
        // Supprimer le code et le temps
        localStorage.removeItem("codeActif");
        localStorage.removeItem("tempsRestant_" + code);
        // Afficher la vue "temps écoulé"
        document.getElementById("vueSession").style.display = "none";
        document.getElementById("vueExpire").style.display = "block";
      }

    }, 1000);

    // Afficher le temps dès le chargement
    afficherTemps(tempsRestant);

    // ==========================================
    // DÉCONNEXION (pause)
    // ==========================================

    function seDeconnecter() {
      // Arrêter le timer
      clearInterval(intervalle);
      // Sauvegarder le temps restant
      localStorage.setItem("tempsRestant_" + code, tempsRestant);
      // Supprimer le code actif (déconnexion)
      localStorage.removeItem("codeActif");
      // Retour à la page de connexion
      alert("⏸ Session mise en pause.\nTon temps restant a été sauvegardé !\nRetape ton code pour reprendre.");
      window.location.href = "index.html";
    }

  </script>

</body>
</html>
